<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShaheenChat | شاهين شات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg-black: #050505; --side-bg: #121212; --input-bg: #1e1e1e; --text-main: #e0e0e0; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-black); color: var(--text-main); font-family: 'Cairo', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* القائمة الجانبية المستوحاة من ChatGPT */
        .sidebar { width: 260px; background: var(--side-bg); display: flex; flex-direction: column; padding: 15px; border-left: 1px solid #222; }
        .new-chat-btn { border: 1px solid #444; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; font-weight: 600; font-size: 0.9rem; }
        .new-chat-btn:hover { background: #2a2a2a; border-color: var(--primary); }
        .new-chat-btn i { color: var(--primary); font-size: 1.1rem; }
        
        .menu-list { flex: 1; overflow-y: auto; }
        .menu-item { padding: 10px; border-radius: 6px; display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 5px; color: #aaa; transition: 0.2s; font-size: 0.95rem; }
        .menu-item:hover { background: #1a1a1a; color: white; }
        .menu-item i { width: 20px; text-align: center; }

        /* منطقة المحادثة */
        .chat-main { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header-mobile { display: none; padding: 10px; border-bottom: 1px solid #222; justify-content: center; }
        #chat-container { flex: 1; overflow-y: auto; padding: 50px 15% 150px; scroll-behavior: smooth; }
        
        /* تصميم الرسائل - نمط Gemini */
        .msg { display: flex; gap: 20px; margin-bottom: 30px; animation: fadeIn 0.4s ease; max-width: 900px; margin-left: auto; margin-right: auto; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1rem; }
        .user-avatar { background: var(--primary); color: black; }
        .bot-avatar { border: 1px solid var(--primary); background: #000; overflow: hidden; }
        .bot-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .content { line-height: 1.8; font-size: 1.1rem; flex: 1; }
        .user-msg-row { background: #1a1a1a; padding: 20px; border-radius: 12px; }

        /* منطقة الإدخال الاحترافية */
        .input-area { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 15%; background: linear-gradient(transparent, var(--bg-black) 40%); }
        .input-container { background: var(--input-bg); border: 1px solid #333; border-radius: 16px; display: flex; align-items: center; padding: 10px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-container:focus-within { border-color: var(--primary); }
        input { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; font-family: 'Cairo'; font-size: 1.1rem; }
        .action-btn { background: var(--primary); border: none; border-radius: 10px; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .action-btn:hover { transform: scale(1.05); }

        /* الشعار والترحيب */
        .welcome-center { text-align: center; margin-top: 15vh; }
        .welcome-logo { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--primary); margin-bottom: 20px; }
        .social-footer { padding-top: 15px; border-top: 1px solid #222; display: flex; justify-content: center; gap: 15px; }
        .social-footer i { color: #555; cursor: pointer; transition: 0.3s; }
        .social-footer i:hover { color: var(--primary); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="new-chat-btn" onclick="location.reload()">
            <i class="fas fa-plus"></i>
            <span>محادثة جديدة</span>
        </div>

        <div class="menu-list">
            <div class="menu-item"><i class="fas fa-lightbulb"></i> بنك الأفكار</div>
            <div class="menu-item"><i class="fas fa-book"></i> خيوط الياسمين</div>
            <div class="menu-item"><i class="fas fa-bullseye"></i> أهداف 2026</div>
            <div class="menu-item"><i class="fas fa-shield-halved"></i> توافق (قريباً)</div>
        </div>

        <div class="social-footer">
            <i class="fab fa-linkedin-in"></i>
            <i class="fab fa-whatsapp"></i>
            <i class="fab fa-x-twitter"></i>
            <i class="fas fa-share-nodes"></i>
        </div>
        <p style="font-size: 0.65rem; color: #444; text-align: center; margin-top: 10px;">ShaheenChat © 2026</p>
    </aside>

    <main class="chat-main">
        <div id="chat-container">
            <div id="welcome-view" class="welcome-center">
                <img src="https://i.postimg.cc/mD3fL8mK/shaheen-logo.png" class="welcome-logo" alt="Logo">
                <h1 style="font-size: 2.5rem; margin: 0;">أهلاً بك يا سيد محمد</h1>
                <p style="color: #666; font-size: 1.1rem;">كيف يمكن لمحرّك شاهين مساعدتك اليوم؟</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <input type="text" id="query-input" placeholder="اسأل شاهين..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="action-btn" onclick="sendMessage()">
                    <i class="fas fa-arrow-up" style="color: black; font-size: 1.2rem;"></i>
                </button>
            </div>
            <p style="text-align: center; font-size: 0.75rem; color: #444; margin-top: 15px;">
                بوابة الابتكار العالمي - رؤية 2026 لخدمة قطاع الأعمال والإدارة
            </p>
        </div>
    </main>

    <script>
        async function sendMessage() {
            const input = document.getElementById('query-input');
            const container = document.getElementById('chat-container');
            const welcome = document.getElementById('welcome-view');
            const text = input.value.trim();

            if (!text) return;
            if (welcome) welcome.style.display = 'none';

            // إضافة رسالة المستخدم
            container.innerHTML += `
                <div class="msg user-msg-row">
                    <div class="avatar user-avatar"><i class="fas fa-user"></i></div>
                    <div class="content"><b>أنت:</b><br>${text}</div>
                </div>`;
            
            input.value = "";
            container.scrollTop = container.scrollHeight;

            // إضافة مكان رد البوت
            const botId = "bot-" + Date.now();
            container.innerHTML += `
                <div class="msg">
                    <div class="avatar bot-avatar"><img src="https://i.postimg.cc/mD3fL8mK/shaheen-logo.png"></div>
                    <div class="content" id="${botId}"><i class="fas fa-spinner fa-spin"></i> شاهين يفكر...</div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('https://shaheen-backend-a5huxtb3zxkpvacbggancq.streamlit.app/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                document.getElementById(botId).innerHTML = `<b>شاهين:</b><br>${data.reply}`;
            } catch (e) {
                document.getElementById(botId).innerHTML = `<span style="color: #ff4444;">سيد محمد، تعذر الاتصال بالمحرك. يرجى التأكد من لوحة تحكم Streamlit.</span>`;
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
