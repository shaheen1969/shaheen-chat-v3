<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهين شات | ShaheenChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; --panel: #121212; --input: #1e1e1e; }
        body { background: var(--bg); color: #e0e0e0; font-family: 'Cairo', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* القائمة الجانبية */
        .sidebar { width: 260px; background: var(--panel); border-left: 1px solid #222; display: flex; flex-direction: column; padding: 20px; }
        .logo-section { text-align: center; padding-bottom: 20px; border-bottom: 1px solid #333; margin-bottom: 20px; }
        /* ربط الشعار من مجلد assets */
        .logo-img { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
        
        .menu-item { padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #aaa; transition: 0.3s; margin-bottom: 5px; }
        .menu-item:hover { background: #1a1a1a; color: white; border-right: 3px solid var(--primary); }

        /* منطقة الشات */
        .chat-main { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-flow { flex: 1; overflow-y: auto; padding: 50px 15%; scroll-behavior: smooth; }
        .msg-row { display: flex; gap: 20px; margin-bottom: 30px; animation: slideUp 0.4s ease; max-width: 850px; margin-left: auto; margin-right: auto; }
        .av { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .user-av { background: var(--primary); color: black; }
        .bot-av { border: 1.5px solid var(--primary); overflow: hidden; background: #000; }
        .bot-av img { width: 100%; height: 100%; object-fit: cover; }
        .txt { line-height: 1.8; font-size: 1.1rem; flex: 1; }

        /* منطقة الإدخال */
        .input-area { padding: 30px 15%; background: linear-gradient(transparent, var(--bg) 50%); }
        .input-box { background: var(--input); border: 1px solid #333; border-radius: 16px; display: flex; align-items: center; padding: 10px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-box:focus-within { border-color: var(--primary); }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; font-family: 'Cairo'; font-size: 1.1rem; }
        .send-btn { background: var(--primary); border: none; border-radius: 12px; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-section">
            <!-- التأكد من المسار الصحيح للشعار -->
            <img src="assets/logo.png" class="logo-img" onerror="this.src='https://i.postimg.cc/mD3fL8mK/shaheen-logo.png'">
            <h3 style="color: var(--primary); margin: 10px 0 0;">شاهين شات</h3>
        </div>
        <div class="menu-item" onclick="location.reload()"><i class="fas fa-plus"></i> محادثة جديدة</div>
        <div style="font-size: 0.75rem; color: #444; margin: 20px 10px 5px;">قصص</div>
        <div class="menu-item"><i class="fas fa-feather-pointed"></i> خيوط الياسمين</div>
    </aside>

    <main class="chat-main">
        <div id="chat-flow">
            <div id="welcome" style="text-align: center; margin-top: 15vh;">
                <h1 style="font-size: 3rem; margin: 0;">شاهين شات</h1>
                <p style="color: #666;">مرحباً بك يا سيد محمد، كيف يمكنني مساعدتك اليوم؟</p>
            </div>
        </div>
        <div class="input-area">
            <div class="input-box">
                <input type="text" id="user-input" placeholder="اسأل شاهين شات..." onkeypress="if(event.key === 'Enter') startChat()">
                <button class="send-btn" onclick="startChat()">
                    <i class="fas fa-arrow-up" style="color: black;"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        async function startChat() {
            const input = document.getElementById('user-input');
            const flow = document.getElementById('chat-flow');
            const welcome = document.getElementById('welcome');
            const text = input.value.trim();

            if (!text) return; // تحقق قبل الإرسال
            if (welcome) welcome.style.display = 'none';

            // عرض رسالة المستخدم
            flow.innerHTML += `
                <div class="msg-row">
                    <div class="av user-av"><i class="fas fa-user"></i></div>
                    <div class="txt"><b>أنت:</b><br>${text}</div>
                </div>`;
            
            input.value = "";
            flow.scrollTop = flow.scrollHeight;

            // إضافة مؤشر التحميل (Loading)
            const botId = "bot-" + Date.now();
            flow.innerHTML += `
                <div class="msg-row">
                    <div class="av bot-av"><img src="assets/logo.png" onerror="this.src='https://i.postimg.cc/mD3fL8mK/shaheen-logo.png'"></div>
                    <div class="txt" id="${botId}"><i class="fas fa-circle-notch fa-spin"></i> جاري التحليل...</div>
                </div>`;
            flow.scrollTop = flow.scrollHeight;

            try {
                // الاتصال برابط السيرفر المباشر في Streamlit
                const response = await fetch('https://shaheen-backend-a5huxtb3zxkpvacbggancq.streamlit.app/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text })
                });
                
                if (!response.ok) throw new Error('Offline');
                const data = await response.json();
                document.getElementById(botId).innerHTML = `<b>شاهين شات:</b><br>${data.reply}`;
            } catch (e) {
                // رسالة ودية في حال فشل الاتصال
                document.getElementById(botId).innerHTML = `
                    <span style="color: #ff5555;">
                        عذراً سيد محمد، يبدو أن المحرك يحتاج لإعادة تشغيل من لوحة التحكم لضمان استقرار الخدمة.
                    </span>`;
            }
            flow.scrollTop = flow.scrollHeight;
        }
    </script>
</body>
</html>
