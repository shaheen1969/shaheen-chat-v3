<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهين شات | ShaheenChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg-black: #050505; --side-bg: #121212; --input-bg: #1e1e1e; --text-main: #e0e0e0; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-black); color: var(--text-main); font-family: 'Cairo', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* القائمة الجانبية - الهيكلية الجديدة */
        .sidebar { width: 260px; background: var(--side-bg); display: flex; flex-direction: column; padding: 15px; border-left: 1px solid #222; }
        
        .logo-area { text-align: center; padding: 20px 0; border-bottom: 1px solid #222; margin-bottom: 20px; }
        .logo-img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--primary); margin-bottom: 10px; object-fit: cover; }
        .brand-name { color: var(--primary); font-weight: 700; font-size: 1.2rem; display: block; }

        .new-chat-btn { border: 1px solid #444; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; font-weight: 600; }
        .new-chat-btn:hover { background: #2a2a2a; border-color: var(--primary); }

        .menu-section-title { font-size: 0.8rem; color: #555; text-transform: uppercase; margin: 15px 10px 5px; letter-spacing: 1px; }
        .menu-item { padding: 10px; border-radius: 6px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #aaa; transition: 0.2s; }
        .menu-item:hover { background: #1a1a1a; color: white; }

        /* منطقة المحادثة الرئيسية */
        .chat-main { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-container { flex: 1; overflow-y: auto; padding: 50px 15% 150px; scroll-behavior: smooth; }
        
        .msg { display: flex; gap: 20px; margin-bottom: 30px; animation: fadeIn 0.4s ease; max-width: 900px; margin-left: auto; margin-right: auto; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .user-avatar { background: var(--primary); color: black; font-size: 0.9rem; }
        .bot-avatar { border: 1px solid var(--primary); background: #000; overflow: hidden; }
        .bot-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .content { line-height: 1.8; font-size: 1.1rem; flex: 1; }

        /* منطقة الإدخال */
        .input-area { position: absolute; bottom: 0; width: 100%; padding: 30px 15%; background: linear-gradient(transparent, var(--bg-black) 40%); }
        .input-container { background: var(--input-bg); border: 1px solid #333; border-radius: 16px; display: flex; align-items: center; padding: 10px 20px; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; font-family: 'Cairo'; font-size: 1.1rem; }
        .send-btn { background: var(--primary); border: none; border-radius: 10px; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area">
            <img src="https://i.postimg.cc/mD3fL8mK/shaheen-logo.png" class="logo-img" alt="Logo">
            <span class="brand-name">شاهين شات</span>
        </div>

        <div class="new-chat-btn" onclick="location.reload()">
            <i class="fas fa-plus"></i>
            <span>محادثة جديدة</span>
        </div>

        <div class="menu-list">
            <div class="menu-section-title">إدارة الأعمال</div>
            <div class="menu-item"><i class="fas fa-lightbulb"></i> بنك الأفكار</div>
            <div class="menu-item"><i class="fas fa-bullseye"></i> أهداف 2026</div>
            
            <div class="menu-section-title">قصص</div>
            <div class="menu-item" title="تجهيز المحتوى لاحقاً"><i class="fas fa-book"></i> خيوط الياسمين</div>
        </div>

        <div style="margin-top: auto; padding-top: 15px; border-top: 1px solid #222; display: flex; justify-content: center; gap: 15px;">
            <i class="fab fa-linkedin-in" style="color: #555; cursor: pointer;"></i>
            <i class="fab fa-whatsapp" style="color: #555; cursor: pointer;"></i>
        </div>
    </aside>

    <main class="chat-main">
        <div id="chat-container">
            <div id="welcome-view" style="text-align: center; margin-top: 15vh;">
                <h1 style="font-size: 2.8rem; color: white; margin-bottom: 10px;">شاهين شات</h1>
                <p style="color: #666; font-size: 1.2rem;">بوابة الابتكار العالمي - مرحباً بك يا سيد محمد</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <input type="text" id="user-input" placeholder="اسأل شاهين شات..." onkeypress="if(event.key === 'Enter') handleResponse()">
                <button class="send-btn" onclick="handleResponse()" id="send-trigger">
                    <i class="fas fa-arrow-up" style="color: black;"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        async function handleResponse() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const welcome = document.getElementById('welcome-view');
            const text = input.value.trim();

            if (!text) return;
            if (welcome) welcome.style.display = 'none';

            // إضافة رسالة المستخدم
            container.innerHTML += `
                <div class="msg">
                    <div class="avatar user-avatar"><i class="fas fa-user"></i></div>
                    <div class="content"><b>أنت:</b><br>${text}</div>
                </div>`;
            
            input.value = "";
            container.scrollTop = container.scrollHeight;

            const botId = "bot-" + Date.now();
            container.innerHTML += `
                <div class="msg">
                    <div class="avatar bot-avatar"><img src="https://i.postimg.cc/mD3fL8mK/shaheen-logo.png"></div>
                    <div class="content" id="${botId}"><i class="fas fa-circle-notch fa-spin"></i> جاري الاتصال بالمحرك...</div>
                </div>`;
            container.scrollTop = container.scrollHeight;

            try {
                // تصحيح الرابط لضمان الاتصال المباشر بمحرك Streamlit الفعال
                const response = await fetch('https://shaheen-backend-a5huxtb3zxkpvacbggancq.streamlit.app/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text })
                });
                
                if (!response.ok) throw new Error('Network status: ' + response.status);
                
                const data = await response.json();
                document.getElementById(botId).innerHTML = `<b>شاهين شات:</b><br>${data.reply}`;
            } catch (e) {
                document.getElementById(botId).innerHTML = `
                    <span style="color: #ff4444;">
                        عذراً سيد محمد، تعذر الاتصال بالمحرك. يرجى التأكد من أن السيرفر في وضع Running في لوحة تحكم Streamlit.
                    </span>`;
                console.error('Connection Error:', e);
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
