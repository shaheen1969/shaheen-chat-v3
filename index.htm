<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShaheenChat | بوابة الابتكار العالمي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0b0d0e; --sidebar: #121416; --green: #2ecc71; --input: #1c1f22; --text: #e0e0e0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* Loading Screen */
        #loader { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 3px solid #333; border-top-color: var(--green); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Layout */
        .sidebar { width: 280px; background: var(--sidebar); display: flex; flex-direction: column; padding: 25px; border-left: 1px solid #222; }
        .logo-box { text-align: center; margin-bottom: 40px; }
        .logo-box img { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--green); padding: 5px; box-shadow: 0 0 15px rgba(46, 204, 113, 0.2); }
        
        .nav-links { list-style: none; flex-grow: 1; }
        .nav-links li { padding: 12px 15px; margin-bottom: 8px; cursor: pointer; border-radius: 10px; transition: 0.3s; display: flex; align-items: center; gap: 12px; font-size: 0.95rem; }
        .nav-links li:hover { background: #1e2124; color: var(--green); }
        .nav-links li.active { background: #1e2124; color: var(--green); border-right: 3px solid var(--green); }
        .badge { background: var(--green); color: #000; font-size: 0.65rem; padding: 2px 8px; border-radius: 5px; margin-right: auto; font-weight: bold; }

        .main-chat { flex: 1; display: flex; flex-direction: column; }
        .chat-view { flex: 1; overflow-y: auto; padding: 40px 15%; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .welcome-screen { text-align: center; margin: auto; }
        .welcome-screen h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to bottom, #fff, var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Chat Input */
        .input-area { padding: 30px 15%; background: linear-gradient(to top, var(--bg), transparent); }
        .input-wrapper { background: var(--input); border-radius: 18px; display: flex; align-items: center; padding: 8px 18px; border: 1px solid #333; transition: 0.3s; }
        .input-wrapper:focus-within { border-color: var(--green); box-shadow: 0 0 10px rgba(46, 204, 113, 0.1); }
        input { flex: 1; background: none; border: none; color: #fff; padding: 12px; outline: none; font-size: 1.05rem; }
        .send-btn { background: var(--green); border: none; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; transition: 0.3s; color: #000; font-size: 1.1rem; }
        .send-btn:hover { transform: scale(1.05); background: #27ae60; }

        /* Social & Footer */
        .social-bar { display: flex; justify-content: center; gap: 20px; padding: 15px; border-top: 1px solid #222; }
        .social-bar a { color: #555; font-size: 1.2rem; transition: 0.3s; }
        .social-bar a:hover { color: var(--green); }
        footer { text-align: center; font-size: 0.75rem; color: #444; padding-bottom: 15px; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p style="color:var(--green); letter-spacing: 2px;">SHAHEEN AI</p>
    </div>

    <aside class="sidebar">
        <div class="logo-box">
            <img src="https://i.ibb.co/vz6m8Xz/shaheen-logo.png" alt="Shaheen">
            <h2 style="margin-top:15px; font-size: 1.3rem;">شاهين شات</h2>
        </div>
        <ul class="nav-links">
            <li class="active"><i class="fas fa-home"></i> الرئيسية</li>
            <li><i class="fas fa-comments"></i> المحادثات</li>
            <li><i class="fas fa-microchip"></i> التوافق <span class="badge">قريباً</span></li>
            <li><i class="fas fa-cog"></i> الإعدادات</li>
            <li><i class="fas fa-paper-plane"></i> تواصل معنا</li>
        </ul>
        <div class="social-bar">
            <a href="#"><i class="fab fa-whatsapp"></i></a>
            <a href="#"><i class="fab fa-telegram"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fas fa-envelope"></i></a>
        </div>
    </aside>

    <main class="main-chat">
        <div class="chat-view" id="chat-box">
            <div class="welcome-screen">
                <h1>كيف يمكنني مساعدتك اليوم؟</h1>
                <p style="color:#666;">نسخة 2026 المطورة - منصة الذكاء الاصطناعي</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="اكتب رسالتك هنا يا سيد محمد...">
                <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
            <footer>
                © 2026 ShaheenChat.com | بوابة الابتكار العالمي | <a href="#" style="color:#444; text-decoration:none;">سياسة الخصوصية</a>
            </footer>
        </div>
    </main>

    <script>
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
            }, 1000);
        };
    </script>
    <script src="script.js"></script>
</body>
</html>
