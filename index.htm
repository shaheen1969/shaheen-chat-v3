<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهين شات | ShaheenChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* التنسيق الأساسي لاستعادة الألوان الفخمة */
        * { box-sizing: border-box; }
        body { background-color: #0b0b0b; color: #ffffff; font-family: 'Cairo', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .container { display: flex; width: 100%; height: 100%; }
        
        /* القائمة الجانبية - استعادة اللون الداكن */
        .sidebar { width: 280px; background: #111111; padding: 30px 20px; border-left: 1px solid #222; display: flex; flex-direction: column; align-items: center; }
        #main-logo { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #00ff88; margin-bottom: 20px; object-fit: cover; box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
        .sidebar h2 { color: #00ff88; font-size: 1.6rem; margin: 0 0 30px 0; font-weight: 700; }
        
        .nav-menu { width: 100%; list-style: none; padding: 0; margin: 0; }
        .nav-menu li { padding: 12px 20px; margin-bottom: 10px; border-radius: 10px; cursor: pointer; transition: 0.3s; color: #aaa; text-align: right; }
        .nav-menu li:hover, .nav-menu li.active { background: #1e1e1e; color: #00ff88; }

        /* منطقة المحادثة والمساحات */
        .main-content { flex: 1; display: flex; flex-direction: column; background: #0b0b0b; position: relative; }
        #chat-box { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; scroll-behavior: smooth; }
        
        .welcome-section { text-align: center; margin-top: 10vh; transition: 0.5s; }
        .welcome-section h1 { color: #00ff88; font-size: 2.8rem; margin-bottom: 10px; }
        .welcome-section p { color: #666; font-size: 1.2rem; }

        /* منطقة الإدخال - تصميم السطر الواحد */
        .input-area { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; padding: 0 40px; }
        .input-container { width: 100%; max-width: 900px; display: flex; background: #1a1a1a; border-radius: 16px; padding: 10px 20px; border: 1px solid #333; align-items: center; }
        #user-input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; font-size: 1.1rem; font-family: 'Cairo'; }
        
        .send-btn { background: #00ff88; border: none; border-radius: 12px; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .send-btn:hover { transform: scale(1.05); background: #00cc6a; }

        /* فقاعات الدردشة */
        .message { padding: 15px 20px; border-radius: 18px; margin: 12px 0; max-width: 75%; line-height: 1.8; font-size: 1.05rem; }
        .user-message { background: #00ff88; color: #000; align-self: flex-end; border-bottom-left-radius: 4px; margin-left: auto; font-weight: 600; }
        .bot-message { background: #1e1e1e; color: #e0e0e0; align-self: flex-start; border-bottom-right-radius: 4px; border-right: 4px solid #00ff88; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <img src="https://i.ibb.co/L6V8zHq/shaheen-logo.png" alt="Shaheen Logo" id="main-logo">
            <h2>شاهين شات</h2>
            <ul class="nav-menu">
                <li class="active">🏠 الرئيسية</li>
                <li>💬 المحادثات</li>
                <li>⚙️ الإعدادات</li>
            </ul>
        </aside>

        <main class="main-content">
            <div id="chat-box">
                <div id="welcome-msg" class="welcome-section">
                    <h1>كيف يمكنني مساعدتك اليوم؟</h1>
                    <p>إصدار 2026 المطوّر - ShaheenChat.com</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <input type="text" id="user-input" placeholder="اكتب رسالتك هنا يا سيد محمد..." autocomplete="off">
                    <button class="send-btn" onclick="send()">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="black"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const welcome = document.getElementById('welcome-msg');
            const msg = input.value.trim();
            
            if(!msg) return;
            if(welcome) welcome.style.display = 'none';

            chatBox.innerHTML += `<div class="message user-message">${msg}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.innerHTML = "جاري التفكير...";
            chatBox.appendChild(botDiv);

            try {
                const res = await fetch('https://shaheen-backend-o6p47v47oa-uc.a.run.app/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                const data = await res.json();
                botDiv.innerHTML = ""; 
                
                let index = 0;
                function type() {
                    if(index < data.reply.length) {
                        botDiv.innerHTML += data.reply.charAt(index);
                        index++;
                        setTimeout(type, 25);
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }
                type();
            } catch(e) {
                botDiv.innerHTML = "عذراً، حدث خطأ في الاتصال.";
            }
        }
        document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') send(); });
    </script>
</body>
</html>
