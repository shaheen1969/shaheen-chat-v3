<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهين شات | ShaheenChat</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- القائمة الجانبية -->
        <aside class="sidebar">
            <div class="logo-container">
                <!-- تم تحديث رابط الشعار هنا ليعمل فوراً -->
                <img src="https://i.ibb.co/L6V8zHq/shaheen-logo.png" alt="Shaheen Logo" id="main-logo" style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid #00ff88;">
                <h2>شاهين شات</h2>
            </div>
            <nav>
                <ul>
                    <li class="active">الرئيسية</li>
                    <li>المحادثات</li>
                    <li>الإعدادات</li>
                </ul>
            </nav>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content" id="chat-container">
            <div class="welcome-section">
                <h1>كيف يمكنني مساعدتك اليوم؟</h1>
                <p>نسخة 2026 المطورة - منصة الذكاء الاصطناعي</p>
            </div>
            <!-- الرسائل ستظهر هنا -->
        </main>

        <!-- منطقة الإدخال -->
        <footer class="input-area">
            <div class="input-container">
                <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
                <button class="send-btn" id="send-button">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>
            <p class="footer-note">© 2026 ShaheenChat.com | بوابة الابتكار العالمي</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
