<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهين شات | ShaheenChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* تصميم الواجهة الاحترافية */
        body { background-color: #0b0b0b; color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .container { display: flex; width: 100%; height: 100%; }
        
        /* القائمة الجانبية */
        .sidebar { width: 260px; background: #111; padding: 20px; border-left: 1px solid #222; display: flex; flex-direction: column; align-items: center; }
        #main-logo { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #00ff88; margin-bottom: 15px; object-fit: cover; }
        .sidebar h2 { color: #00ff88; font-size: 1.5rem; margin-top: 0; }

        /* منطقة المحادثة */
        .main-content { flex: 1; display: flex; flex-direction: column; background: #0b0b0b; position: relative; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; display: flex; flex-direction: column; }
        
        .welcome-section { text-align: center; margin-top: 15vh; flex: 1; }
        .welcome-section h1 { color: #00ff88; font-size: 2.2rem; }
        .welcome-section p { color: #888; font-size: 1.1rem; }

        /* منطقة الإدخال */
        .input-area { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 800px; }
        .input-container { display: flex; background: #1e1e1e; border-radius: 15px; padding: 8px 15px; border: 1px solid #333; transition: 0.3s; }
        .input-container:focus-within { border-color: #00ff88; }
        #user-input { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; font-size: 1rem; font-family: 'Cairo'; }
        
        .send-btn { background: #00ff88; border: none; border-radius: 12px; padding: 8px 20px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; }
        .send-btn:hover { background: #00cc6a; transform: scale(1.05); }

        /* تنسيق الرسائل */
        .message { padding: 12px 18px; border-radius: 15px; margin: 10px 0; max-width: 75%; line-height: 1.7; font-size: 1rem; position: relative; }
        .user-message { background: #00ff88; color: black; align-self: flex-end; border-bottom-left-radius: 2px; margin-left: auto; font-weight: bold; }
        .bot-message { background: #1e1e1e; color: #e0e0e0; align-self: flex-start; border-bottom-right-radius: 2px; border-right: 4px solid #00ff88; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <img src="https://i.ibb.co/L6V8zHq/shaheen-logo.png" alt="Shaheen Logo" id="main-logo">
            <h2>شاهين شات</h2>
        </aside>

        <main class="main-content">
            <div id="chat-box">
                <div id="welcome-msg" class="welcome-section">
                    <h1>كيف يمكنني مساعدتك اليوم؟</h1>
                    <p>إصدار 2026 المطوّر - ShaheenChat.com</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <input type="text" id="user-input" placeholder="اكتب رسالتك هنا يا سيد محمد..." autocomplete="off">
                    <button class="send-btn" onclick="send()">
                        <b style="font-size: 16px;">إرسال</b>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function send() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const welcome = document.getElementById('welcome-msg');
            const msg = input.value.trim();
            
            if(!msg) return;
            if(welcome) welcome.style.display = 'none';

            // إضافة رسالة المستخدم
            chatBox.innerHTML += `<div class="message user-message">${msg}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // تجهيز مكان رد "شاهين"
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.innerHTML = "جاري التفكير...";
            chatBox.appendChild(botDiv);

            try {
                const res = await fetch('https://shaheen-backend-o6p47v47oa-uc.a.run.app/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                const data = await res.json();
                botDiv.innerHTML = ""; // مسح جملة جاري التفكير
                
                // تأثير الكتابة التدريجي
                let index = 0;
                function type() {
                    if(index < data.reply.length) {
                        botDiv.innerHTML += data.reply.charAt(index);
                        index++;
                        setTimeout(type, 25);
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }
                type();
            } catch(e) {
                botDiv.innerHTML = "عذراً سيد محمد، حدث خطأ في الاتصال بالسيرفر.";
            }
        }

        // دعم الإرسال عبر زر Enter
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
