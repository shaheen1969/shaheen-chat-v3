<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهين شات | ShaheenChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #0b0b0b; --panel: #161616; }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* القائمة الجانبية المحدثة */
        .sidebar { width: 280px; background: var(--panel); border-left: 1px solid #222; display: flex; flex-direction: column; padding: 25px; }
        .logo-section { text-align: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px; }
        .logo-img { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
        .platform-title { color: var(--primary); display: block; margin-top: 10px; font-weight: 700; font-size: 1.2rem; }

        .menu-list { flex: 1; }
        .section-header { font-size: 0.75rem; color: #555; text-transform: uppercase; margin: 15px 0 10px; font-weight: 700; }
        .menu-item { padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #aaa; transition: 0.3s; }
        .menu-item:hover { background: #222; color: white; }

        /* منطقة الشات */
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        #chat-flow { flex: 1; overflow-y: auto; padding: 50px 15%; scroll-behavior: smooth; }
        .msg { display: flex; gap: 20px; margin-bottom: 30px; animation: fadeIn 0.4s ease; max-width: 850px; margin: 0 auto 30px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .user-av { background: var(--primary); color: black; }
        .bot-av { border: 1.5px solid var(--primary); overflow: hidden; }
        .content { line-height: 1.8; font-size: 1.1rem; }

        /* منطقة الإدخال */
        .footer-input { padding: 30px 15%; background: linear-gradient(transparent, var(--bg) 50%); }
        .input-group { background: #1e1e1e; border: 1px solid #333; border-radius: 15px; display: flex; align-items: center; padding: 10px 20px; }
        #user-msg { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; font-family: 'Cairo'; }
        .send-btn { background: var(--primary); border: none; border-radius: 10px; width: 45px; height: 45px; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-section">
            <img src="https://i.postimg.cc/mD3fL8mK/shaheen-logo.png" class="logo-img" alt="Shaheen Logo">
            <span class="platform-title">شاهين شات</span>
        </div>

        <div class="menu-list">
            <div class="section-header">الأعمال</div>
            <div class="menu-item"><i class="fas fa-lightbulb"></i> بنك الأفكار</div>
            
            <div class="section-header">قصص</div>
            <div class="menu-item"><i class="fas fa-feather-pointed"></i> خيوط الياسمين</div>
        </div>
    </aside>

    <main class="chat-main">
        <div id="chat-flow">
            <div style="text-align: center; margin-top: 20vh;">
                <h1 style="font-size: 3rem;">شاهين شات</h1>
                <p style="color: #666;">مرحباً بك يا سيد محمد، كيف يمكنني مساعدتك اليوم؟</p>
            </div>
        </div>

        <div class="footer-input">
            <div class="input-group">
                <input type="text" id="user-msg" placeholder="اسأل شاهين شات..." onkeypress="if(event.key === 'Enter') handleChat()">
                <button class="send-btn" onclick="handleChat()">
                    <i class="fas fa-arrow-up" style="color: black;"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        async function handleChat() {
            const input = document.getElementById('user-msg');
            const flow = document.getElementById('chat-flow');
            const query = input.value.trim();
            if (!query) return;

            // عرض رسالة المستخدم
            flow.innerHTML = `<div class="msg"><div class="avatar user-av"><i class="fas fa-user"></i></div><div class="content"><b>أنت:</b><br>${query}</div></div>`;
            input.value = "";

            // مؤشر التحميل
            const botId = "bot-" + Date.now();
            flow.innerHTML += `<div class="msg"><div class="avatar bot-av"><img src="https://i.postimg.cc/mD3fL8mK/shaheen-logo.png" style="width:100%"></div><div class="content" id="${botId}"><i class="fas fa-spinner fa-spin"></i> جاري المعالجة...</div></div>`;
            flow.scrollTop = flow.scrollHeight;

            try {
                // الاتصال برابط السيرفر المباشر
                const response = await fetch('https://shaheen-backend-a5huxtb3zxkpvacbggancq.streamlit.app/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: query })
                });
                const data = await response.json();
                document.getElementById(botId).innerHTML = `<b>شاهين شات:</b><br>${data.reply}`;
            } catch (e) {
                document.getElementById(botId).innerHTML = `<span style="color: #ff5555;">سيد محمد، تعذر الاتصال بالمحرك. يرجى التأكد من لوحة تحكم Streamlit.</span>`;
            }
            flow.scrollTop = flow.scrollHeight;
        }
    </script>
</body>
</html>
