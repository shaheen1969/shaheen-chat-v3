<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهين شات | ShaheenChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-green: #00ff88; --bg-dark: #0b0b0b; --panel-dark: #161616; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* القائمة الجانبية */
        .sidebar { width: 280px; background: var(--panel-dark); padding: 25px 15px; border-left: 1px solid #222; display: flex; flex-direction: column; justify-content: space-between; }
        .logo-section { text-align: center; }
        .logo-container { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--primary-green); overflow: hidden; margin: 0 auto 15px; background: #000; box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
        #main-logo { width: 100%; height: 100%; object-fit: cover; }
        
        /* خيارات القائمة الجانبية */
        .menu-items { margin-top: 30px; flex-grow: 1; }
        .menu-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid #333; color: #ccc; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; transition: 0.3s; font-family: 'Cairo'; }
        .menu-btn:hover { background: #222; border-color: var(--primary-green); color: white; }
        .plus-btn { background: var(--primary-green) !important; color: black !important; font-weight: bold; justify-content: center; font-size: 1.2rem; }

        /* منطقة الشات */
        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-display { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 80%; padding: 15px 25px; border-radius: 20px; line-height: 1.8; animation: fadeIn 0.3s ease; position: relative; }
        .user-msg { background: var(--primary-green); color: black; align-self: flex-end; border-bottom-left-radius: 4px; font-weight: bold; }
        .bot-msg { background: #222; color: #e0e0e0; align-self: flex-start; border-bottom-right-radius: 4px; border-right: 5px solid var(--primary-green); }

        /* منطقة الإدخال */
        .input-wrapper { padding: 20px 60px 40px; display: flex; justify-content: center; background: linear-gradient(transparent, var(--bg-dark)); }
        .input-box { width: 100%; max-width: 900px; background: #1e1e1e; border-radius: 18px; border: 1px solid #333; display: flex; align-items: center; padding: 8px 15px; }
        #user-query { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; font-family: 'Cairo'; font-size: 1.1rem; }
        
        /* تذييل الصفحة والأيقونات */
        .footer-icons { display: flex; justify-content: center; gap: 20px; padding-bottom: 20px; border-top: 1px solid #222; padding-top: 15px; }
        .social-icon { color: #666; font-size: 1.3rem; transition: 0.3s; cursor: pointer; }
        .social-icon:hover { color: var(--primary-green); }
        .tawafuq-badge { font-size: 0.7rem; color: #555; text-align: center; margin-top: 10px; letter-spacing: 1px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <!-- القائمة الجانبية -->
    <aside class="sidebar">
        <div class="logo-section">
            <div class="logo-container">
                <img src="https://i.postimg.cc/mD3fL8mK/shaheen-logo.png" alt="S" id="main-logo">
            </div>
            <h3 style="color: var(--primary-green); margin: 0;">شاهين شات</h3>
            <p style="font-size: 0.8rem; color: #888;">بوابة الابتكار العالمي</p>
        </div>

        <div class="menu-items">
            <button class="menu-btn plus-btn" onclick="location.reload()"><i class="fas fa-plus"></i> محادثة جديدة</button>
            <button class="menu-btn"><i class="fas fa-lightbulb"></i> بنك الأفكار</button>
            <button class="menu-btn"><i class="fas fa-flag"></i> أهداف 2026</button>
            <button class="menu-btn"><i class="fas fa-book"></i> خيوط الياسمين</button>
        </div>

        <div class="footer-section">
            <div class="footer-icons">
                <i class="fab fa-twitter social-icon"></i>
                <i class="fab fa-linkedin social-icon"></i>
                <i class="fab fa-whatsapp social-icon"></i>
                <i class="fas fa-share-alt social-icon"></i>
            </div>
            <div class="tawafuq-badge">TAWAFUQ 2026 - SOON</div>
        </div>
    </aside>

    <!-- منطقة الشات الرئيسية -->
    <main class="main-chat">
        <div id="chat-display">
            <div style="text-align: center; margin-top: 10vh; opacity: 0.5;">
                <i class="fas fa-quote-right" style="font-size: 2rem; color: var(--primary-green);"></i>
                <h2 style="color: white;">خيوط الياسمين في مهبّ الغربة</h2>
                <p style="font-style: italic;">"حين يتحول الضعف إلى قوة والشتات إلى وطن"</p>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <input type="text" id="user-query" placeholder="اسأل شاهين يا سيد محمد..." onkeypress="if(event.key === 'Enter') handleSend()">
                <button onclick="handleSend()" style="background: var(--primary-green); border: none; border-radius: 12px; width: 45px; height: 45px; cursor: pointer;">
                    <i class="fas fa-paper-plane" style="color: black; font-size: 1.2rem;"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        async function handleSend() {
            const input = document.getElementById('user-query');
            const display = document.getElementById('chat-display');
            const query = input.value.trim();
            if(!query) return;

            display.innerHTML += `<div class="message user-msg">${query}</div>`;
            input.value = "";
            display.scrollTop = display.scrollHeight;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot-msg';
            loadingDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحليل...';
            display.appendChild(loadingDiv);

            try {
                // الربط المباشر مع رابط تطبيقك الفعلي في Streamlit
                const response = await fetch('https://shaheen-backend-a5huxtb3zxkpvacbggancq.streamlit.app/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: query })
                });
                const data = await response.json();
                loadingDiv.innerHTML = data.reply;
            } catch (e) {
                loadingDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> عذراً سيد محمد، تعذر الاتصال بالمحرك. تأكد أن السيرفر في وضع Running.';
            }
            display.scrollTop = display.scrollHeight;
        }
    </script>
</body>
</html>
