<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهين شات | ShaheenChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; --side: #121212; --input: #1e1e1e; --text: #e0e0e0; }
        * { box-sizing: border-box; transition: 0.3s; }
        body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* القائمة الجانبية الاحترافية */
        .sidebar { width: 280px; background: var(--side); display: flex; flex-direction: column; padding: 20px; border-left: 1px solid #222; }
        .brand { text-align: center; padding-bottom: 20px; border-bottom: 1px solid #333; margin-bottom: 15px; }
        .logo { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
        .name { color: var(--primary); font-weight: 700; font-size: 1.3rem; display: block; margin-top: 10px; }

        /* علامة الزائد (محادثة جديدة) */
        .new-btn { border: 1px solid #444; border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: white; margin-bottom: 20px; font-weight: 600; }
        .new-btn:hover { background: #222; border-color: var(--primary); }
        .new-btn i { color: var(--primary); }

        /* الأيقونات المطلوبة */
        .section-title { font-size: 0.75rem; color: #555; text-transform: uppercase; margin: 15px 5px 8px; letter-spacing: 1.5px; font-weight: 700; }
        .nav-link { padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #aaa; margin-bottom: 5px; font-size: 0.95rem; }
        .nav-link:hover { background: #1a1a1a; color: white; }
        .nav-link i { width: 20px; text-align: center; font-size: 1.1rem; }

        /* منطقة الشات */
        .chat-container { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-window { flex: 1; overflow-y: auto; padding: 50px 15% 150px; }
        .msg-row { display: flex; gap: 20px; margin-bottom: 35px; animation: fadeInUp 0.4s ease; max-width: 850px; margin-left: auto; margin-right: auto; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .u-av { background: var(--primary); color: black; }
        .b-av { border: 1.5px solid var(--primary); background: #000; overflow: hidden; }
        .b-av img { width: 100%; height: 100%; object-fit: cover; }
        .text { line-height: 1.8; font-size: 1.15rem; flex: 1; }

        /* منطقة الإدخال وزر الإرسال المصلح */
        .input-area { position: absolute; bottom: 0; width: 100%; padding: 40px 15%; background: linear-gradient(transparent, var(--bg) 50%); }
        .input-box { background: var(--input); border: 1px solid #333; border-radius: 18px; display: flex; align-items: center; padding: 10px 20px; }
        .input-box:focus-within { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 255, 136, 0.1); }
        input { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; font-family: 'Cairo'; font-size: 1.1rem; }
        .send-btn { background: var(--primary); border: none; border-radius: 12px; width: 48px; height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* أيقونات التواصل */
        .socials { margin-top: auto; padding-top: 20px; border-top: 1px solid #222; display: flex; justify-content: center; gap: 15px; }
        .socials i { color: #555; cursor: pointer; font-size: 1.2rem; }
        .socials i:hover { color: var(--primary); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <img src="https://i.postimg.cc/mD3fL8mK/shaheen-logo.png" class="logo" alt="Shaheen Logo">
            <span class="name">شاهين شات</span>
        </div>

        <div class="new-btn" onclick="location.reload()">
            <i class="fas fa-plus"></i>
            <span>محادثة جديدة</span>
        </div>

        <div class="menu">
            <div class="section-title">الأفكار والإدارة</div>
            <div class="nav-link"><i class="fas fa-lightbulb"></i> الأفكار</div>
            <div class="nav-link"><i class="fas fa-graduation-cap"></i> العلم نور</div>
            <div class="nav-link"><i class="fas fa-rss"></i> بلوغر</div>
            <div class="nav-link"><i class="fas fa-star"></i> الجديد</div>

            <div class="section-title">قصص ملهمة</div>
            <div class="nav-link" title="خيوط الياسمين في مهبّ الغربة"><i class="fas fa-feather-pointed"></i> خيوط الياسمين</div>
        </div>

        <div class="socials">
            <i class="fab fa-linkedin-in"></i>
            <i class="fab fa-whatsapp"></i>
            <i class="fab fa-x-twitter"></i>
            <i class="fas fa-share-alt"></i>
        </div>
        <p style="text-align: center; font-size: 0.6rem; color: #444; margin-top: 10px;">بوابة الابتكار العالمي 2026</p>
    </aside>

    <main class="chat-container">
        <div id="chat-window">
            <div id="welcome" style="text-align: center; margin-top: 15vh;">
                <h1 style="font-size: 3rem; margin-bottom: 10px;">أهلاً بك يا سيد محمد</h1>
                <p style="color: #666; font-size: 1.2rem;">محرك شاهين المطور جاهز لخدمتك الآن.</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <input type="text" id="user-input" placeholder="اسأل شاهين شات..." onkeypress="if(event.key === 'Enter') handleResponse()">
                <button class="send-btn" onclick="handleResponse()">
                    <i class="fas fa-arrow-up" style="color: black; font-size: 1.3rem;"></i>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function handleResponse() {
            const input = document.getElementById('user-input');
            const window = document.getElementById('chat-window');
            const welcome = document.getElementById('welcome');
            const text = input.value.trim();

            if (!text) return; // منع الإرسال الفارغ
            if (welcome) welcome.style.display = 'none';

            // إضافة رسالة المستخدم
            window.innerHTML += `
                <div class="msg-row">
                    <div class="avatar u-av"><i class="fas fa-user"></i></div>
                    <div class="text"><b>أنت:</b><br>${text}</div>
                </div>`;
            
            input.value = "";
            window.scrollTop = window.scrollHeight;

            // إنشاء معرف الرد المصلح
            const loadingId = "bot-" + Date.now();
            window.innerHTML += `
                <div class="msg-row">
                    <div class="avatar b-av"><img src="https://i.postimg.cc/mD3fL8mK/shaheen-logo.png"></div>
                    <div class="text" id="${loadingId}"><i class="fas fa-spinner fa-spin"></i> شاهين يحلل طلبك...</div>
                </div>`;
            window.scrollTop = window.scrollHeight;

            try {
                // الربط المباشر مع محرك Streamlit
                const response = await fetch('https://shaheen-backend-a5huxtb3zxkpvacbggancq.streamlit.app/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                // تحديث الرد فوراً
                document.getElementById(loadingId).innerHTML = `<b>شاهين شات:</b><br>${data.reply}`;
            } catch (e) {
                document.getElementById(loadingId).innerHTML = `<span style="color: #ff5555;">عذراً سيد محمد، واجه المحرك ضغطاً لحظياً. يرجى التأكد من تشغيل السيرفر.</span>`;
            }
            window.scrollTop = window.scrollHeight;
        }
    </script>
</body>
</html>
