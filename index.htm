<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهين شات | ShaheenChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #00ff88; --bg-dark: #0b0b0b; --panel-dark: #161616; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--panel-dark); padding: 30px 20px; border-left: 1px solid #222; display: flex; flex-direction: column; align-items: center; }
        .logo-container { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--primary-green); overflow: hidden; margin-bottom: 20px; background: #000; box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
        #main-logo { width: 100%; height: 100%; object-fit: cover; }
        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-display { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .message { max-width: 80%; padding: 15px 25px; border-radius: 20px; line-height: 1.8; font-size: 1.05rem; position: relative; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .user-msg { background: var(--primary-green); color: black; align-self: flex-end; border-bottom-left-radius: 4px; font-weight: bold; }
        .bot-msg { background: #222; color: #e0e0e0; align-self: flex-start; border-bottom-right-radius: 4px; border-right: 5px solid var(--primary-green); }
        .input-wrapper { padding: 20px 60px 40px; display: flex; justify-content: center; background: linear-gradient(transparent, var(--bg-dark)); }
        .input-box { width: 100%; max-width: 900px; background: #1e1e1e; border-radius: 18px; border: 1px solid #333; display: flex; align-items: center; padding: 10px 20px; transition: 0.3s; }
        .input-box:focus-within { border-color: var(--primary-green); box-shadow: 0 0 20px rgba(0, 255, 136, 0.15); }
        #user-query { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; font-family: 'Cairo'; font-size: 1.1rem; }
        .send-button { background: var(--primary-green); border: none; border-radius: 12px; width: 50px; height: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; margin-right: 10px; }
        .send-button:hover { transform: scale(1.1); background: #00e67a; }
        .welcome-screen { text-align: center; margin-top: 15vh; color: var(--primary-green); transition: 0.5s; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-container">
            <!-- استخدام رابط الشعار المستقر -->
            <img src="https://i.postimg.cc/mD3fL8mK/shaheen-logo.png" alt="Shaheen Logo" id="main-logo">
        </div>
        <h2 style="color: var(--primary-green); margin-bottom: 5px;">شاهين شات</h2>
        <p style="font-size: 0.85rem; color: #777; text-align: center;">بوابة الابتكار العالمي <br> 2026</p>
    </aside>

    <main class="main-chat">
        <div id="chat-display">
            <div id="welcome-msg" class="welcome-screen">
                <h1 style="font-size: 3rem; margin-bottom: 10px;">أهلاً بك يا سيد محمد</h1>
                <p style="color: #888; font-size: 1.2rem;">محرك شاهين المطور جاهز لخدمتك الآن.</p>
            </div>
        </div>
        <div class="input-wrapper">
            <div class="input-box">
                <input type="text" id="user-query" placeholder="اسأل شاهين..." onkeypress="if(event.key === 'Enter') handleSend()">
                <button class="send-button" onclick="handleSend()">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="black"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        async function handleSend() {
            const input = document.getElementById('user-query');
            const display = document.getElementById('chat-display');
            const welcome = document.getElementById('welcome-msg');
            const query = input.value.trim();
            
            if(!query) return;

            // إخفاء رسالة الترحيب عند بدء المحادثة
            if(welcome) welcome.remove();

            // عرض رسالة المستخدم
            display.innerHTML += `<div class="message user-msg">${query}</div>`;
            input.value = "";
            display.scrollTop = display.scrollHeight;

            // إضافة رسالة انتظار
            const loadingId = "load-" + Date.now();
            display.innerHTML += `<div id="${loadingId}" class="message bot-msg">جاري المعالجة...</div>`;
            display.scrollTop = display.scrollHeight;

            try {
                // الربط مع رابط السيرفر الجديد الخاص بك في Streamlit
                const response = await fetch('https://shaheen-backend-a5huxtb3zxkpvacbggancq.streamlit.app/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: query })
                });
                
                const data = await response.json();
                document.getElementById(loadingId).innerHTML = data.reply;
            } catch (e) {
                document.getElementById(loadingId).innerHTML = "عذراً سيد محمد، تعذر الاتصال بالمحرك. يرجى التأكد من أن السيرفر في وضع Running.";
            }
            display.scrollTop = display.scrollHeight;
        }
    </script>
</body>
</html>
