<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهين شات | ShaheenChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b0b0b; color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: #111; padding: 30px 20px; border-left: 1px solid #222; display: flex; flex-direction: column; align-items: center; }
        #main-logo { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #00ff88; margin-bottom: 20px; object-fit: cover; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: #0b0b0b; position: relative; }
        #chat-box { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; }
        .welcome-section { text-align: center; margin-top: 10vh; color: #00ff88; }
        .input-area { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; padding: 0 40px; }
        .input-container { width: 100%; max-width: 900px; display: flex; background: #1a1a1a; border-radius: 16px; padding: 10px; border: 1px solid #333; align-items: center; }
        #user-input { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; font-size: 1.1rem; font-family: 'Cairo'; }
        .send-btn { background: #00ff88; border: none; border-radius: 12px; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .message { padding: 15px; border-radius: 15px; margin: 10px 0; max-width: 80%; line-height: 1.6; }
        .user-message { background: #00ff88; color: black; align-self: flex-end; margin-left: auto; }
        .bot-message { background: #1e1e1e; color: #00ff88; align-self: flex-start; border-right: 4px solid #00ff88; }
    </style>
</head>
<body>
    <div style="display: flex; width: 100%;">
        <aside class="sidebar">
            <img src="https://i.postimg.cc/mD3fL8mK/shaheen-logo.png" alt="Logo" id="main-logo">
            <h2 style="color: #00ff88;">شاهين شات</h2>
        </aside>
        <main class="main-content">
            <div id="chat-box">
                <div id="welcome" class="welcome-section">
                    <h1>كيف يمكنني مساعدتك اليوم؟</h1>
                    <p style="color: #666;">إصدار 2026 المطوّر | بوابة الابتكار العالمي</p>
                </div>
            </div>
            <div class="input-area">
                <div class="input-container">
                    <input type="text" id="user-input" placeholder="اكتب رسالتك هنا يا سيد محمد...">
                    <button class="send-btn" onclick="sendMsg()">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="black"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function sendMsg() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const welcome = document.getElementById('welcome');
            const text = input.value.trim();
            if(!text) return;

            if(welcome) welcome.style.display = 'none';
            chatBox.innerHTML += `<div class="message user-message">${text}</div>`;
            input.value = "";

            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.innerHTML = "جاري الاتصال بالسيرفر...";
            chatBox.appendChild(botDiv);

            try {
                // استخدام رابط محرك بديل ومحدث لتجاوز خطأ 404
                const response = await fetch('https://shaheen-backend-o6p47v47oa-uc.a.run.app/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                botDiv.innerHTML = data.reply;
            } catch (e) {
                botDiv.innerHTML = "عذراً سيد محمد، المحرك يحتاج لإعادة تشغيل من لوحة تحكم السيرفر.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
