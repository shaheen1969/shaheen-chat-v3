<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهين شات | ShaheenChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #00ff88; --bg-dark: #0b0b0b; --panel-dark: #161616; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 260px; background: var(--panel-dark); padding: 20px; border-left: 1px solid #222; display: flex; flex-direction: column; align-items: center; }
        .logo-container { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--primary-green); overflow: hidden; margin-bottom: 15px; background: #000; }
        #main-logo { width: 100%; height: 100%; object-fit: cover; }
        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-display { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 80%; padding: 15px 20px; border-radius: 18px; line-height: 1.6; font-size: 1.05rem; }
        .user-msg { background: var(--primary-green); color: black; align-self: flex-end; border-bottom-left-radius: 2px; font-weight: bold; }
        .bot-msg { background: #222; color: #e0e0e0; align-self: flex-start; border-bottom-right-radius: 2px; border-right: 4px solid var(--primary-green); }
        .input-wrapper { padding: 20px 40px 40px; display: flex; justify-content: center; }
        .input-box { width: 100%; max-width: 850px; background: #1e1e1e; border-radius: 15px; border: 1px solid #333; display: flex; align-items: center; padding: 8px 15px; transition: 0.3s; }
        .input-box:focus-within { border-color: var(--primary-green); box-shadow: 0 0 15px rgba(0, 255, 136, 0.1); }
        #user-query { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; font-family: 'Cairo'; font-size: 1.1rem; }
        .send-button { background: var(--primary-green); border: none; border-radius: 10px; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .send-button:hover { transform: scale(1.05); background: #00e67a; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-container">
            <img src="https://i.postimg.cc/mD3fL8mK/shaheen-logo.png" alt="S" id="main-logo">
        </div>
        <h3 style="color: var(--primary-green); margin-top: 0;">شاهين شات</h3>
        <p style="font-size: 0.8rem; color: #666; text-align: center;">بوابة الابتكار العالمي</p>
    </aside>

    <main class="main-chat">
        <div id="chat-display">
            <div style="text-align: center; margin-top: 15vh; color: var(--primary-green);">
                <h1 style="font-size: 2.5rem;">أهلاً بك يا سيد محمد</h1>
                <p style="color: #888;">أنا محرك شاهين المطور، كيف يمكنني خدمتك اليوم؟</p>
            </div>
        </div>
        <div class="input-wrapper">
            <div class="input-box">
                <input type="text" id="user-query" placeholder="اسأل شاهين..." onkeypress="if(event.key === 'Enter') handleSend()">
                <button class="send-button" onclick="handleSend()">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="black"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        async function handleSend() {
            const input = document.getElementById('user-query');
            const display = document.getElementById('chat-display');
            const query = input.value.trim();
            if(!query) return;

            display.innerHTML = ""; // تنظيف الشاشة عند بدء المحادثة
            display.innerHTML += `<div class="message user-msg">${query}</div>`;
            input.value = "";

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot-msg';
            loadingDiv.innerHTML = "جاري التحليل والرد...";
            display.appendChild(loadingDiv);

            try {
                const response = await fetch('https://shaheen-backend-o6p47v47oa-uc.a.run.app/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: query })
                });
                const data = await response.json();
                loadingDiv.innerHTML = data.reply;
            } catch (e) {
                loadingDiv.innerHTML = "عذراً، يبدو أن هناك ضغطاً على السيرفر. المحرك يعمل ولكن يرجى المحاولة بعد لحظات.";
            }
            display.scrollTop = display.scrollHeight;
        }
    </script>
</body>
</html>
