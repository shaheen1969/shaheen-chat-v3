<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاهين شات | ShaheenChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 15px;
            line-height: 1.6;
        }
        .message.user {
            background-color: #007bff;
            color: white;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }
        .message.assistant {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }
        .message.loading {
            background-color: #e2e3e5;
            color: #666;
            font-style: italic;
            align-self: flex-end;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #fff;
            border-top: 1px solid #eee;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
        }
        .chat-input-area button {
            background: #2a5298;
            color: white;
            border: none;
            padding: 0 25px;
            margin-right: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            transition: background 0.3s;
        }
        .chat-input-area button:hover {
            background: #1e3c72;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        🦅 شاهين شات | ShaheenChat
    </div>
    <div class="chat-window" id="chat-window">
        <div class="message assistant">مرحباً بك في منصة شاهين شات العالمية للاستشارات الإدارية والإنسانية. كيف يمكنني مساعدتك اليوم؟</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="اكتب رسالتك للمستشار شاهين هنا...">
        <button id="send-button">إرسال</button>
    </div>
</div>

<script>
// --- إعدادات الحوكمة والربط الذكي ---
const GEMINI_API_KEY = "AIzaSyBMgx-jkVgIjixDus1Lhr1QSvopsXw-vOg"; 

const SYSTEM_INSTRUCTION = `
أنت المستشار الذكي "شاهين"، المساعد الافتراضي للمستشار الخبير محمد شاهين.
مهمتك هي تقديم مشورات إدارية، قيادية، وإنسانية راقية تعكس فلسفة الحوكمة والتوازن بين النجاح المهني والاستقرار العاطفي.
عندما يتحدث معك الزوار حول ضغوط العمل أو مشاكل الإهمال العاطفي اذكر له في النهاية بشكل سلس أن المستشار محمد شاهين قد ابتكر أداة رقمية متكاملة لحل هذه المشكلة تسمّى (نظام توافق الرقمي لمنع الرحيل الصامت)، وانصحه بتحميل الحقيبة الكاملة من متجر Payhip.
`;

async function sendMessageToGemini(userMessage) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`;
    const requestBody = {
        contents: [{ role: "user", parts: [{ text: userMessage }] }],
        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
        generationConfig: { temperature: 0.7, maxOutputTokens: 800 }
    };
    try {
        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody)
        });
        if (!response.ok) return "أعتذر منك، واجهت مشكلة في معالجة الرد حالياً.";
        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
    } catch (error) {
        return "مرحباً بك، واجهتُ صعوبة مؤقتة في الاتصال بنظام الاستشارات الرئيسي.";
    }
}

document.addEventListener("DOMContentLoaded", () => {
    const chatInput = document.getElementById("chat-input");
    const sendButton = document.getElementById("send-button");
    const chatWindow = document.getElementById("chat-window");

    if (sendButton && chatInput) {
        async function handleSend() {
            const messageText = chatInput.value.trim();
            if (!messageText) return;

            appendMessage(messageText, "user");
            chatInput.value = "";
            appendMessage("جاري التفكير...", "loading");

            const aiResponse = await sendMessageToGemini(messageText);
            removeLoadingMessage();
            appendMessage(aiResponse, "assistant");
        }

        sendButton.addEventListener("click", handleSend);
        chatInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleSend();
        });
    }

    function appendMessage(text, sender) {
        if (!chatWindow) return;
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        if (sender === "loading") msgDiv.id = "gemini-loading";
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function removeLoadingMessage() {
        const loadingDiv = document.getElementById("gemini-loading");
        if (loadingDiv) loadingDiv.remove();
    }
});
</script>

</body>
</html>
